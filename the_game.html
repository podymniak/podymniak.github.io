<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>♡ My Bathroom Tour ♡</title>
    <link rel="shortcut icon" href="images/teaBreak.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.min.css" />

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #viewer {
            width: 100vw;
            height: 100vh;
        }

        /* Message Box styling */
        #coords-log {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            max-width: 300px;
            line-height: 1.4;
            border: 1px solid #555;
        }

        /* Forces the mouse to change to the clicking hand when hovering over comment items */
        .clickable-comment-marker {
            cursor: pointer !important;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/three/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.min.js"></script>
</head>

<body>

<div id="viewer"></div>
<div id="thumbnails"></div>
<div id="coords-log">Click an item to inspect it, or click the floor for coordinates!</div>

<script>
    const arrowIcon = "https://www.freeiconspng.com/uploads/arrow-icon-clip-art-file-down-arrow-icon-png-balin-icon-arrow-right--32.png";
    const handIcon = "https://www.freeiconspng.com/uploads/helping-hand-icon-png-11.png";
    const questionIcon = "https://www.freeiconspng.com/uploads/question-answer-icon-10.png1";
    const thoughtIcon = "https://www.freeiconspng.com/uploads/bubble-cloud-thought-icon-2.png";

    const mainIconSize = 32
    const minerIconSize = 32

    const panoramaIndex = {
        bathroom_doors: 0,
        bathroom_shower: 1,
        kitchen_window: 2,
        kitchen_doors: 3,
        balcony: 4,
        hall_mid: 5,
        hall_exit: 6,
        salon_doors: 7
    }

    const panoramas = [
        {
            id: 'bathroom_doors',
            src: 'renders/bathroom_doors.png',
            thumb: 'renders/bathroom_doors.png',
            markers: [
                {
                    id: 'bathroom_doors-to-bathroom_shower',
                    image: arrowIcon,
                    size: { width: mainIconSize, height: mainIconSize },
                    yaw: 0.0,
                    pitch: -0.2,
                    tooltip: 'Go to the shower',
                    data: { targetIndex: panoramaIndex.bathroom_shower } // Moving action
                },{
                    id: 'bathroom_doors-to-hall_mid',
                    image: handIcon,
                    size: { width: mainIconSize, height: mainIconSize },
                    yaw: 4.50,
                    pitch: -1.12,
                    tooltip: 'Leave',
                    data: { targetIndex: panoramaIndex.hall_mid } // Moving action
                },

                {
                    id: 'bathroom_doors-mirror',
                    image: thoughtIcon,
                    size: { width: minerIconSize, height: minerIconSize },
                    yaw: 5.52,
                    pitch: -0.06,
                    className: 'clickable-comment-marker',
                    // data: { message: "No reflection..." }
                    data: { messages: ["No reflection...", "Am I a ghost?"] }
                },{
                    id: 'bathroom_doors-radiator',
                    image: thoughtIcon,
                    size: { width: minerIconSize, height: minerIconSize },
                    yaw: 1.89,
                    pitch: -0.10,
                    className: 'clickable-comment-marker',
                    data: { message: "It's still cold." }
                },{
                    id: 'bathroom_doors-pawlacz',
                    image: handIcon,
                    size: { width: minerIconSize, height: minerIconSize },
                    yaw: 4.99,
                    pitch: 0.90,
                    className: 'clickable-comment-marker',
                    data: { messages: ["Cleaning supplies.","Nothing interesting inside."] }
                },{
                    id: 'bathroom_doors-szafka_wc',
                    image: handIcon,
                    size: { width: minerIconSize, height: minerIconSize },
                    yaw: 0.63,
                    pitch: -0.26,
                    className: 'clickable-comment-marker',
                    data: { messages: ["Toiletries.","Nothing interesting inside."] }
                }
            ]
        },
        {
            id: 'bathroom_shower',
            src: 'renders/bathroom_shower.png',
            thumb: 'renders/bathroom_shower.png',
            markers: [
                {
                    id: 'bathroom_shower-to-bathroom_doors',
                    image: arrowIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 3.16,
                    pitch: -0.51,
                    tooltip: 'Go to the doors',
                    data: {targetIndex: panoramaIndex.bathroom_doors}, // Moving action
                },

                {
                    id: 'bathroom_shower-shower',
                    image: handIcon,
                    size: { width: minerIconSize, height: minerIconSize },
                    yaw: 0.65,
                    pitch: -0.56,
                    className: 'clickable-comment-marker',
                    data: { messages: ["There's no water.", "They still haven't finished."] }
                }
            ]
        },
        {
            id: 'kitchen_window',
            src: 'renders/kitchen_window.png',
            thumb: 'renders/kitchen_window.png',
            markers: [
                {
                    id: 'kitchen_window-to-kitchen_doors',
                    image: arrowIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 2.33,
                    pitch: -0.35,
                    tooltip: 'Go to the doors',
                    data: {targetIndex: panoramaIndex.kitchen_doors}, // Moving action
                }
            ]
        },
        {
            id: 'kitchen_doors',
            src: 'renders/kitchen_doors.png',
            thumb: 'renders/kitchen_doors.png',
            markers: [
                {
                    id: 'kitchen_doors-to-kitchen_window',
                    image: arrowIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 5.78,
                    pitch: -0.26,
                    tooltip: 'Go to the window',
                    data: {targetIndex: panoramaIndex.kitchen_window}, // Moving action
                },{
                    id: 'kitchen_doors-to-hall_mid',
                    image: arrowIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 1.31,
                    pitch: -0.26,
                    tooltip: 'Go to the hall',
                    data: {targetIndex: panoramaIndex.hall_mid}, // Moving action
                },

                {
                    id: 'kitchen_doors-todo',
                    image: thoughtIcon,
                    size: { width: minerIconSize, height: minerIconSize },
                    yaw: 4.39,
                    pitch: -0.35,
                    className: 'clickable-comment-marker',
                    data: { messages:
                            [
                                "A TO-DO list.",
                                "Not now...",
                            ] }
                }
            ]
        },
        {
            id: 'balcony',
            src: 'renders/balcony.png',
            thumb: 'renders/balcony.png',
            markers: [
                {
                    id: 'balcony-to-salon_doors',
                    image: arrowIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 3.33,
                    pitch: -0.35,
                    tooltip: 'Go back',
                    data: {targetIndex: panoramaIndex.salon_doors}, // Moving action
                },

                {
                    id: 'balcony-void',
                    image: thoughtIcon,
                    size: { width: 70, height: 100 },
                    yaw: 0.31,
                    pitch: -0.22,
                    className: 'clickable-comment-marker',
                    data: { messages:
                            [
                                "I don't see anything. The fog it too thick.",
                                "The view is usually so beautiful from here. It always makes me feel better."
                            ] }
                },{
                    id: 'balcony-down',
                    image: thoughtIcon,
                    size: { width: 70, height: 100 },
                    yaw: 5.5,
                    pitch: -1.03,
                    className: 'clickable-comment-marker',
                    data: { message: "A long way down." }
                },{
                    id: 'balcony-up',
                    image: thoughtIcon,
                    size: { width: 70, height: 100 },
                    yaw: 2.15,
                    pitch: 1.11,
                    className: 'clickable-comment-marker',
                    data: { message: "Last floor." }
                }
            ]
        },
        {
            id: 'hall_mid',
            src: 'renders/hall_mid.png',
            thumb: 'renders/hall_mid.png',
            markers: [
                {
                    id: 'hall_mid-to-bathroom_doors',
                    image: handIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 2.11,
                    pitch: -1.33,
                    tooltip: 'Go to the bathroom',
                    data: {targetIndex: panoramaIndex.bathroom_doors}, // Moving action
                },{
                    id: 'hall_mid-to-salon_doors',
                    image: arrowIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 0.36,
                    pitch: -0.38,
                    tooltip: 'Go to the main room',
                    data: {targetIndex: panoramaIndex.salon_doors}, // Moving action
                },{
                    id: 'hall_mid-to-kitchen_doors',
                    image: arrowIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 4.48,
                    pitch: -0.35,
                    tooltip: 'Go to the kitchen',
                    data: {targetIndex: panoramaIndex.kitchen_doors}, // Moving action
                },{
                    id: 'hall_mid-to-hall_exit',
                    image: arrowIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 3.57,
                    pitch: -0.22,
                    tooltip: 'The front doors',
                    data: {targetIndex: panoramaIndex.hall_exit}, // Moving action
                }
            ]
        },
        {
            id: 'hall_exit',
            src: 'renders/hall_exit.png',
            thumb: 'renders/hall_exit.png',
            markers: [
                {
                    id: 'hall_exit-to-bathroom_doors',
                    image: handIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 0.51,
                    pitch: -0.32,
                    tooltip: 'Go to the bathroom',
                    data: {targetIndex: panoramaIndex.bathroom_doors}, // Moving action
                },{
                    id: 'hall_exit-to-salon_doors',
                    image: arrowIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 0.39,
                    pitch: -0.21,
                    tooltip: 'Go to the main room',
                    data: {targetIndex: panoramaIndex.salon_doors}, // Moving action
                },{
                    id: 'hall_exit-to-kitchen_doors',
                    image: arrowIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 6.14,
                    pitch: -0.27,
                    tooltip: 'Go to the kitchen',
                    data: {targetIndex: panoramaIndex.kitchen_doors}, // Moving action
                },

                {
                    id: 'hall_exit-exit_doors',
                    image: handIcon,
                    size: { width: 70, height: 100 },
                    yaw: 2.99,
                    pitch: -1.05,
                    className: 'clickable-comment-marker',
                    data: { message: "It's locked." }
                }
            ]
        },
        {
            id: 'salon_doors',
            src: 'renders/salon_doors.png',
            thumb: 'renders/salon_doors.png',
            markers: [
                {
                    id: 'salon_doors-to-hall_mid',
                    image: arrowIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 3.82,
                    pitch: -0.35,
                    tooltip: 'Go to the hall',
                    data: {targetIndex: panoramaIndex.hall_mid}, // Moving action
                },{
                    id: 'salon_doors-to-balcony',
                    image: arrowIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 0.26,
                    pitch: -0.25,
                    tooltip: 'Go to the balcony',
                    data: {targetIndex: panoramaIndex.balcony}, // Moving action
                }
            ]
        },
    ];

    // let current = panoramaIndex.balcony;
    let current = 0;

    // Initialize Viewer
    const viewer = new PhotoSphereViewer.Viewer({
        container: 'viewer',
        panorama: panoramas[current].src,
        mousemove: true,
        mousewheel: true,
        navbar: false,
        defaultZoomLvl: 0,
        plugins: [
            [PhotoSphereViewer.MarkersPlugin, {}]
        ]
    });

    const markersPlugin = viewer.getPlugin(PhotoSphereViewer.MarkersPlugin);

    viewer.addEventListener('ready', () => {
        markersPlugin.setMarkers(panoramas[current].markers);
    }, { once: true });

    // Handle marker clicks dynamically
    markersPlugin.addEventListener('select-marker', ({ marker }) => {
        const logBox = document.getElementById('coords-log');

        if (!marker.data) return;

        // Door / navigation marker
        if (marker.data.targetIndex !== undefined) {
            loadPanorama(marker.data.targetIndex);
            return;
        }

        // Comment marker with multiple messages
        if (marker.data.messages) {

            if (marker.data.currentMessage === undefined) {
                marker.data.currentMessage = 0;
            }

            const index = marker.data.currentMessage;

            logBox.innerHTML = `💬 ${marker.data.messages[index]}`;

            marker.data.currentMessage =
                (index + 1) % marker.data.messages.length;
        }

        // Backward compatibility with old markers
        else if (marker.data.message) {
            logBox.innerHTML = `💬 ${marker.data.message}`;
        }
    });

    // Helper Tool: regular background click yields coordinates
    viewer.addEventListener('click', ({ data }) => {
        if (!data.yaw) return;
        const logBox = document.getElementById('coords-log');
        logBox.innerHTML = `yaw: ${data.yaw.toFixed(2)}, pitch: ${data.pitch.toFixed(2)}`;
    });

    const thumbnailsContainer = document.getElementById('thumbnails');

    function loadPanorama(index) {
        current = index;

        viewer.setPanorama(panoramas[index].src).then(() => {
            markersPlugin.setMarkers(panoramas[index].markers || []);

            // Reset message text when moving to a new room
            document.getElementById('coords-log').innerHTML = "Click an item to inspect it, or click the floor for coordinates!";
        });

        updateActiveThumb();
    }

    function updateActiveThumb() {
        document.querySelectorAll('.thumb').forEach((img, i) => {
            img.classList.toggle('active', i === current);
        });
    }

    panoramas.forEach((pano, index) => {
        const img = document.createElement('img');
        img.src = pano.thumb;
        img.className = 'thumb';
        img.onclick = () => loadPanorama(index);
        thumbnailsContainer.appendChild(img);
    });

    updateActiveThumb();
</script>

</body>
</html>
