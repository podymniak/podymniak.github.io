<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>♡ My Bathroom Tour ♡</title>
    <link rel="shortcut icon" href="images/teaBreak.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.min.css" />

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #viewer {
            width: 100vw;
            height: 100vh;
        }

        /* Message Box styling */
        #coords-log {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            max-width: 300px;
            line-height: 1.4;
            border: 1px solid #555;
        }

        /* Forces the mouse to change to the clicking hand when hovering over comment items */
        .clickable-comment-marker {
            cursor: pointer !important;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/three/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.min.js"></script>
</head>

<body>

<div id="viewer"></div>
<div id="thumbnails"></div>
<div id="coords-log">Click an item to inspect it, or click the floor for coordinates!</div>

<script>
    const arrowIcon = "https://www.freeiconspng.com/uploads/arrow-icon-clip-art-file-down-arrow-icon-png-balin-icon-arrow-right--32.png";
    const handIcon = "https://www.freeiconspng.com/uploads/helping-hand-icon-png-11.png1";
    const questionIcon = "https://www.freeiconspng.com/uploads/question-answer-icon-10.png1";
    const thoughtIcon = "https://www.freeiconspng.com/uploads/bubble-cloud-thought-icon-2.png1";

    const mainIconSize = 32
    const minerIconSize = 32

    const panoramas = [
        {
            id: 'bathroom_doors',
            src: 'renders/bath_new_365.png',
            thumb: 'renders/bath_new_365.png',
            markers: [
                {
                    id: 'bathroom_doors-to-bathroom_shower',
                    image: arrowIcon,
                    size: { width: mainIconSize, height: mainIconSize },
                    yaw: 0.0,
                    pitch: -0.2,
                    tooltip: 'Go to the shower',
                    data: { targetIndex: 1 } // Moving action
                },{
                    id: 'bathroom_doors-mirror',
                    image: thoughtIcon,
                    size: { width: 70, height: 100 },
                    yaw: 5.52,
                    pitch: -0.06,
                    className: 'clickable-comment-marker',
                    data: { message: "No reflection..." }
                },{
                    id: 'bathroom_doors-radiator',
                    image: thoughtIcon,
                    size: { width: 200, height: 300 },
                    yaw: 1.89,
                    pitch: -0.10,
                    className: 'clickable-comment-marker',
                    data: { message: "It's completely cold." }
                },{
                    id: 'bathroom_doors-pawlacz',
                    image: handIcon,
                    size: { width: 32, height: 32 },
                    yaw: 4.99,
                    pitch: 0.90,
                    className: 'clickable-comment-marker',
                    data: { message: "Nothing inside." }
                },{
                    id: 'bathroom_doors-szafka_wc',
                    image: handIcon,
                    size: { width: 32, height: 32 },
                    yaw: 0.63,
                    pitch: -0.05,
                    className: 'clickable-comment-marker',
                    data: { message: "Nothing inside." }
                }
            ]
        },
        {
            id: 'bathroom_shower',
            src: 'renders/bath_new_366.png',
            thumb: 'renders/bath_new_366.png',
            markers: [
                {
                    id: 'bathroom_shower-to-bathroom_doors',
                    image: arrowIcon,
                    size: {width: mainIconSize, height: mainIconSize},
                    yaw: 0.21,
                    pitch: -0.35,
                    tooltip: 'Go to the doors',
                    data: {targetIndex: 0}, // Moving action
                },{
                    id: 'bathroom_shower-shower',
                    image: handIcon,
                    size: { width: 32, height: 32 },
                    yaw: 3.92,
                    pitch: -0.72,
                    className: 'clickable-comment-marker',
                    data: { message: "There's no water." }
                }
            ]
        },
    ];

    let current = 0;

    // Initialize Viewer
    const viewer = new PhotoSphereViewer.Viewer({
        container: 'viewer',
        panorama: panoramas[current].src,
        mousemove: true,
        mousewheel: true,
        navbar: false,
        defaultZoomLvl: 0,
        plugins: [
            [PhotoSphereViewer.MarkersPlugin, {}]
        ]
    });

    const markersPlugin = viewer.getPlugin(PhotoSphereViewer.MarkersPlugin);

    viewer.addEventListener('ready', () => {
        markersPlugin.setMarkers(panoramas[current].markers);
    }, { once: true });

    // Handle marker clicks dynamically
    markersPlugin.addEventListener('select-marker', ({ marker }) => {
        const logBox = document.getElementById('coords-log');

        if (marker.data) {
            // Case A: It's a door/walking arrow
            if (marker.data.targetIndex !== undefined) {
                loadPanorama(marker.data.targetIndex);
            }
            // Case B: It's an object comment marker
            else if (marker.data.message !== undefined) {
                logBox.innerHTML = `💬 ${marker.data.message}`;
            }
        }
    });

    // Helper Tool: regular background click yields coordinates
    viewer.addEventListener('click', ({ data }) => {
        if (!data.yaw) return;
        const logBox = document.getElementById('coords-log');
        logBox.innerHTML = `yaw: ${data.yaw.toFixed(2)}, pitch: ${data.pitch.toFixed(2)}`;
    });

    const thumbnailsContainer = document.getElementById('thumbnails');

    function loadPanorama(index) {
        current = index;

        viewer.setPanorama(panoramas[index].src).then(() => {
            markersPlugin.setMarkers(panoramas[index].markers || []);

            // Reset message text when moving to a new room
            document.getElementById('coords-log').innerHTML = "Click an item to inspect it, or click the floor for coordinates!";
        });

        updateActiveThumb();
    }

    function updateActiveThumb() {
        document.querySelectorAll('.thumb').forEach((img, i) => {
            img.classList.toggle('active', i === current);
        });
    }

    panoramas.forEach((pano, index) => {
        const img = document.createElement('img');
        img.src = pano.thumb;
        img.className = 'thumb';
        img.onclick = () => loadPanorama(index);
        thumbnailsContainer.appendChild(img);
    });

    updateActiveThumb();
</script>

</body>
</html>
